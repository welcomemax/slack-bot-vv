display_information:
  name: ВкусВилл заказ
  description: Общий заказ готовой еды во ВкусВилле
  background_color: "#2e7d32"
features:
  bot_user:
    display_name: вкусвилл
    always_online: true
  slash_commands:
    - command: /vv
      description: Акции на готовую еду и общий заказ на сегодня
      should_escape: false
oauth_config:
  scopes:
    bot:
      - chat:write
      - commands
      - app_mentions:read
      - reactions:write
settings:
  event_subscriptions:
    bot_events:
      - app_mention
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
